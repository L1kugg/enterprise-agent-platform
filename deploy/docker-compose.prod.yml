services:
  app:
    build: ..
    image: enterprise-agent-platform:prod
    container_name: enterprise-agent-platform
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env.production
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/enterprise_agent_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      APP_SECURITY_ENABLED: "true"
      APP_VECTOR_STORE_BACKEND: pgvector
      APP_REQUIRE_PGVECTOR: "true"
      APP_PGVECTOR_URL: jdbc:postgresql://pgvector:5432/iqk_platform
      APP_INGESTION_QUEUE_BACKEND: redis_stream
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: enterprise-agent-platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M

  mysql:
    image: mysql:8.0.36
    container_name: enterprise-agent-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: enterprise_agent_platform
    ports:
      - "127.0.0.1:3306:3306"
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=200", "--innodb-buffer-pool-size=256M"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: enterprise-agent-platform-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: enterprise-agent-platform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: enterprise-agent-platform
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: enterprise-agent-platform-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: iqk_platform
      POSTGRES_USER: ${APP_PGVECTOR_USERNAME}
      POSTGRES_PASSWORD: ${APP_PGVECTOR_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_PGVECTOR_USERNAME} -d iqk_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    container_name: enterprise-agent-platform-tempo-lite
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tmp/tempo

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: enterprise-agent-platform-web:prod
    container_name: enterprise-agent-platform-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5

  # 天气 MCP 翻译壳：把 app 的 JSON-RPC tools/call 桥接到 Open-Meteo 免费天气 API。
  # 仅标准库、无自定义镜像；端口只绑回环（与其它基础组件同姿势），
  # app 经 compose 内网以 http://mcp-weather:9101 访问（白名单收窄容器名，
  # allowed-internal-addresses 按 mcp-weather:9101@172.16.0.0/12 显式授权容器网段）。
  mcp-weather:
    image: python:3.12-slim
    container_name: enterprise-agent-platform-mcp-weather
    restart: unless-stopped
    command: ["python", "/srv/mcp_weather.py"]
    volumes:
      - ../mcp-weather/mcp_weather.py:/srv/mcp_weather.py:ro
    ports:
      - "127.0.0.1:9101:9101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9101/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  pgvector-data:
  tempo-data:
