server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 文档入库走 /api/ 反代上传 PDF，默认 1MB 限制会直接 413，放宽到与后端一致（100MB）
  client_max_body_size 100m;

  # 用 Docker 内置 DNS 动态解析 app：静态 proxy_pass 只在 nginx 启动时解析一次，
  # app 容器重建后换内网 IP（尤其新增/删除容器改变 IP 排布时）会一直 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  # SSE 流式端点：关闭缓冲让 token 逐帧透传。
  # 注意不要禁用 chunked：SSE 响应本身是分块流，禁掉后报文失去边界。
  location ~ ^/api/(ai/chat/stream|ai/react/chat/stream|ai/workflow/react/chat/stream)$ {
    set $backend_app app;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
  }

  # 普通 API：开启缓冲，保留上游 chunked 或 Content-Length 的正确报文边界。
  # 之前全局 proxy_buffering off + chunked_transfer_encoding off 会把 chunked
  # 响应的长度信息剥掉又不缓冲，浏览器 fetch 因收不到响应结束边界而永远挂起
  # （登录按钮一直转圈的根因；curl 恰好能靠 Connection: close 兜住所以没暴露）。
  location /api/ {
    # 变量形式的 proxy_pass 不会自动剥离 location 前缀，用 rewrite 手工去掉 /api/
    set $backend_app app;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
