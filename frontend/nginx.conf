server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 文档入库走 /api/ 反代上传 PDF，默认 1MB 限制会直接 413，放宽到与后端一致（100MB）
  client_max_body_size 100m;

  # 用 Docker 内置 DNS 动态解析 app：静态 proxy_pass 只在 nginx 启动时解析一次，
  # app 容器重建后换内网 IP（尤其新增/删除容器改变 IP 排布时）会一直 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    # 变量形式的 proxy_pass 不会自动剥离 location 前缀，用 rewrite 手工去掉 /api/
    set $backend_app app;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
